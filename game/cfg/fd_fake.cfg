// =====================================================================
//  fd_fake.cfg  -  practice server settings (run on the map via 'fake')
//  Values you may want to change live in fd_user.cfg
// =====================================================================

sv_cheats 1
// demo starts exactly at tv_record (otherwise it also contains the tv_delay seconds before it)
tv_delay 0
tv_record_immediate 1

// endless round, no team logic getting in the way
mp_warmup_end
mp_ignore_round_win_conditions 1
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 0
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_respawn_immunitytime 0

// everyone respawns a couple of seconds after death. CS2 decides it at the moment of death,
// so a "hold key to respawn" does not bring back bots that are already dead
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_use_respawn_waves 0
mp_respawnwavetime_t 0
mp_respawnwavetime_ct 0

// money and buying
mp_buy_anywhere 1
mp_buytime 99999
mp_maxmoney 65535
mp_startmoney 65535
mp_afterroundmoney 65535
ammo_grenade_limit_total 5

// bots: only the ones you add yourself
bot_quota_mode normal
bot_quota 0
sv_auto_adjust_bot_difficulty 0
bot_difficulty 3
bot_allow_grenades 0
bot_allow_machine_guns 0
bot_allow_shotguns 0
bot_allow_snipers 0
mp_weapons_allow_typecount -1

// movement / weapons
sv_infinite_ammo 2
sv_autobunnyhopping 1
sv_enablebunnyhopping 1

// dropped weapons disappear when nobody is near (fps, less clutter)
weapon_auto_cleanup_time 15

mp_restartgame 1
