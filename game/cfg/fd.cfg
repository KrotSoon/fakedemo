// =====================================================================
//  fd.cfg  -  entry point of the CS2 fake demo config
//  Installed into ...\game\csgo\cfg by the FakeDemo launcher (fakedemo.ps1 install)
//  1. Main menu:   exec fd          (enables GOTV - without it no demo is written)
//  2. Console:     map de_mirage    (any map, casual is fine)
//  3. On the map:  fake             -> binds (server settings are applied automatically)
//  4. Record:      tv_record name   ... kills ...   DEL = stop
//
//  Only fd_user.cfg should be edited (keys, weapon kits, values).
// =====================================================================

// GOTV must be on before the map loads, it cannot be enabled on a running map
tv_enable 1
// "custom" mode: on map start the game runs gamemode_custom_server.cfg -> fd_fake.cfg
game_type 3
game_mode 0

alias "fake"   "exec fd_actions; exec fd_user; echo fake mode on - type fdhelp"
alias "fdhelp" "exec fd_blank; exec fd_help"
// your normal binds back (fd_unfake.cfg is generated from your Steam binds on install)
alias "unfake" "exec fd_unfake"
// server settings by hand, if a map was loaded outside the custom mode (no bots on the map yet!)
alias "fdserver" "exec fd_fake"
// workshop maps: ws = list, ws1 ws2 ... = load (fd_ws.cfg is generated by the launcher)
exec fd_ws

echo ""
echo "_____________________[FAKE DEMO {{VERSION}}]_____________________"
echo "GOTV enabled. Now:  map de_mirage  (or ws = workshop maps)   then   fake"
echo "fdhelp -> keys and commands"
echo "unfake -> your normal binds back (do it before playing normally)"
echo "_______________________________________________________________"
