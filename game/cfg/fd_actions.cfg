// =====================================================================
//  fd_actions.cfg  -  what every key does. Keys are assigned in fd_user.cfg
// =====================================================================

// restart round: everyone respawns, dropped weapons are gone
alias "fd_restart" "mp_restartgame 1"

// hold: fly through walls (rocket-jump style moves)
alias "+fd_noclip" "noclip 1"
alias "-fd_noclip" "noclip 0"

// toggle: you take damage on screen but never die (bots die normally: buddha_ignore_bots)
alias "fd_buddha"     "fd_buddha_on"
alias "fd_buddha_on"  "buddha 1; buddha_ignore_bots 1; buddha_reset_hp 100; alias fd_buddha fd_buddha_off; echo buddha: on"
alias "fd_buddha_off" "buddha 0; alias fd_buddha fd_buddha_on; echo buddha: off"
// buddha draws a red debug cross where you get hit (no cvar to turn it off): clear them
alias "fd_clear" "ent_clear_debug_overlays; cl_ent_clear_debug_overlays"

// bots. bot_kick (and lowering bot_quota while bots exist) also kicks the SourceTV bot and
// recording dies until map reload. 'kick <name>' is safe, so bots get names from fixed pools
// (names must exist in the CS2 bot profile) and are kicked by name, then bot_quota 0.
// fm_kickall (FakeMimic plugin) removes the bots FakeMimic added; without the plugin it is just 'unknown command'.
// bot_add raises bot_quota by 2 in CS2 (an extra random bot joins), so it is lowered back by 1
alias "fd_botkick"  "alias fd_addt fd_t1; alias fd_addct fd_ct1; kick Marlin; kick Efe; kick Shadow; kick Kao; kick Dabisi; kick Akani; kick Masthead; kick Sails; kick Severn; kick Tony; kick Vypa; kick Hogarth; kick Firwood; kick Orin; kick Litmow; kick Frank; fm_kickall; bot_quota 0"
// max 8 per team: a 9th add would fail but still lower bot_quota -> SourceTV kicked
alias "fd_tmax"  "echo max 8 T bots - BACKSPACE removes all"
alias "fd_ctmax" "echo max 8 CT bots - BACKSPACE removes all"
alias "fd_addt"     "fd_t1"
alias "fd_addct"    "fd_ct1"
alias "fd_t1" "bot_add_t Marlin;   incrementvar bot_quota 0 64 -1; alias fd_addt fd_t2"
alias "fd_t2" "bot_add_t Efe;      incrementvar bot_quota 0 64 -1; alias fd_addt fd_t3"
alias "fd_t3" "bot_add_t Shadow;   incrementvar bot_quota 0 64 -1; alias fd_addt fd_t4"
alias "fd_t4" "bot_add_t Kao;      incrementvar bot_quota 0 64 -1; alias fd_addt fd_t5"
alias "fd_t5" "bot_add_t Dabisi;   incrementvar bot_quota 0 64 -1; alias fd_addt fd_t6"
alias "fd_t6" "bot_add_t Akani;    incrementvar bot_quota 0 64 -1; alias fd_addt fd_t7"
alias "fd_t7" "bot_add_t Masthead; incrementvar bot_quota 0 64 -1; alias fd_addt fd_t8"
alias "fd_t8" "bot_add_t Sails;    incrementvar bot_quota 0 64 -1; alias fd_addt fd_tmax"
alias "fd_ct1" "bot_add_ct Severn;  incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct2"
alias "fd_ct2" "bot_add_ct Tony;    incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct3"
alias "fd_ct3" "bot_add_ct Vypa;    incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct4"
alias "fd_ct4" "bot_add_ct Hogarth; incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct5"
alias "fd_ct5" "bot_add_ct Firwood; incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct6"
alias "fd_ct6" "bot_add_ct Orin;    incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct7"
alias "fd_ct7" "bot_add_ct Litmow;  incrementvar bot_quota 0 64 -1; alias fd_addct fd_ct8"
alias "fd_ct8" "bot_add_ct Frank;   incrementvar bot_quota 0 64 -1; alias fd_addct fd_ctmax"
alias "fd_botplace" "bot_place"
alias "fd_botkill"  "bot_kill all"
// toggle: bots stand still / walk and shoot
alias "fd_botstop"  "fd_botstop_on"
alias "fd_botstop_on"  "bot_stop 1; alias fd_botstop fd_botstop_off; echo bots: stop"
alias "fd_botstop_off" "bot_stop 0; alias fd_botstop fd_botstop_on; echo bots: go"

// hold: x10 speed (reload, smoke/molotov fade). Release returns to x1
alias "+fd_fast" "fd_speed_fast"
alias "-fd_fast" "fd_speed_normal"

alias "fd_stoprec" "tv_stoprecord"

// digits: weapons by default; the FakeMimic plugin re-points them to menu picks while its menu is open
alias "fm_d1" "slot1"
alias "fm_d2" "slot2"
alias "fm_d3" "slot3"
alias "fm_d4" "slot4"
alias "fm_d5" "slot5"
alias "fm_d6" "slot6"
alias "fm_d7" "slot7"
alias "fm_d8" "slot8"
alias "fm_d9" "slot9"

// third person back -> third person face -> first person (shoulder setup from the CS2 _fake.cfg)
alias "fd_cam_shoulder" "cam_ideallag 0; cam_idealdist 50; c_thirdpersonshoulder 1; c_thirdpersonshoulderoffset 8.5; c_thirdpersonshoulderaimdist 720; c_thirdpersonshoulderheight -1; c_minpitch 0; c_maxpitch 0; cam_idealpitch 0"
alias "fd_cam"      "fd_cam_back"
alias "fd_cam_back" "thirdperson; fd_cam_shoulder; cam_idealyaw 0; alias fd_cam fd_cam_face; echo camera: behind"
alias "fd_cam_face" "thirdperson; fd_cam_shoulder; cam_idealyaw 135; alias fd_cam fd_cam_1st; echo camera: face"
alias "fd_cam_1st"  "firstperson; alias fd_cam fd_cam_back; echo camera: first person"
// in third person: camera stays, mouse turns the model (Alt+mouse buttons move the view)
alias "fd_maya" "thirdperson_mayamode"

// FakeXray plugin: bots glow through walls for you only (GOTV never sees it)
alias "fd_xray" "fx_xray"
