// =====================================================================
//  fd_user.cfg  -  the only file you need to edit
//  Weapon kits, speeds and the key for every action.
// =====================================================================

// ---------- weapon kits (F2 / F3) ----------
alias "fd_kit1" "give weapon_ak47; give weapon_deagle; fd_nades; give item_assaultsuit"
alias "fd_kit2" "give weapon_awp; give weapon_cz75a; fd_nades; give item_assaultsuit"
alias "fd_nades" "give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_molotov"

// console shortcuts: type 'ak', 'awp' ...
alias "ak"    "give weapon_ak47"
alias "m4"    "give weapon_m4a1"
alias "m4s"   "give weapon_m4a1_silencer"
alias "awp"   "give weapon_awp"
alias "scout" "give weapon_ssg08"
alias "deag"  "give weapon_deagle"
alias "r8"    "give weapon_revolver"
alias "usp"   "give weapon_usp_silencer"
alias "glock" "give weapon_glock"
alias "nades" "fd_nades"
alias "armor" "give item_assaultsuit"

// ---------- speeds ----------
alias "fd_speed_fast"   "host_timescale 10"
alias "fd_speed_slow"   "host_timescale 0.5"
alias "fd_speed_normal" "host_timescale 1"

// ---------- keys ----------
// change the key in quotes, keep the action name. Keys list: ...\game\csgo\cfg\user_keys_default.vcfg
bind "F1"        "fd_restart"
bind "F2"        "fd_kit1"
bind "F3"        "fd_kit2"
bind "v"         "+fd_noclip"
bind "t"         "fd_buddha"
bind "BACKSPACE" "fd_botkick"
bind ","         "fd_addct"
bind "."         "fd_addt"
bind "o"         "fd_botstop"
bind "p"         "fd_botplace"
bind "k"         "fd_botkill"
bind "z"         "+fd_fast"
bind "MOUSE5"    "fd_speed_slow"
bind "MOUSE4"    "fd_speed_normal"
bind "DEL"       "fd_stoprec"
bind "RSHIFT"    "fd_cam"
bind "ENTER"     "fd_maya"
bind "x"         "fd_clear"
bind "j"         "fd_wallhack"

// FakeMimic menu (needs plugins_on). While the menu is open, 1-9 pick menu items;
// otherwise they switch weapons as usual (aliases fm_d1..fm_d9 in fd_actions.cfg)
bind "h" "fm_menu"
bind "1" "fm_d1"
bind "2" "fm_d2"
bind "3" "fm_d3"
bind "4" "fm_d4"
bind "5" "fm_d5"
bind "6" "fm_d6"
bind "7" "fm_d7"
bind "8" "fm_d8"
bind "9" "fm_d9"