// =====================================================================
//  fd_user.cfg  -  weapon kits and speeds (edit here); the keys come from the launcher
// =====================================================================

// ---------- weapon kits (F2 / F3) ----------
alias "fd_kit1" "give weapon_ak47; give weapon_deagle; fd_nades; give item_assaultsuit"
alias "fd_kit2" "give weapon_awp; give weapon_cz75a; fd_nades; give item_assaultsuit"
alias "fd_nades" "give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_molotov"

// console shortcuts: type 'ak', 'awp' ...
alias "ak"    "give weapon_ak47"
alias "m4"    "give weapon_m4a1"
alias "m4s"   "give weapon_m4a1_silencer"
alias "awp"   "give weapon_awp"
alias "scout" "give weapon_ssg08"
alias "deag"  "give weapon_deagle"
alias "r8"    "give weapon_revolver"
alias "usp"   "give weapon_usp_silencer"
alias "glock" "give weapon_glock"
alias "nades" "fd_nades"
alias "armor" "give item_assaultsuit"

// ---------- speeds ----------
alias "fd_speed_fast"   "host_timescale 10"
alias "fd_speed_slow"   "host_timescale 0.5"
alias "fd_speed_normal" "host_timescale 1"

// ---------- keys ----------
// keys are set in the FakeDemo launcher (gear > Keys) and written here when the configs go in
//{{BINDS}}

// while the FakeMimic menu is open, 1-9 pick menu items; otherwise they switch weapons as usual
// (aliases fm_d1..fm_d9 in fd_actions.cfg)
bind "1" "fm_d1"
bind "2" "fm_d2"
bind "3" "fm_d3"
bind "4" "fm_d4"
bind "5" "fm_d5"
bind "6" "fm_d6"
bind "7" "fm_d7"
bind "8" "fm_d8"
bind "9" "fm_d9"