// =====================================================================
//  v3_playback.cfg  -  demo playback speed, pause and time skips
//  Speeds use demo_timescale: exact at any FPS (host_framerate gave x0.12 instead of x0.33 at a low FPS).
//  HLAE scales the free camera by a frame time that shrinks with the speed and follows the FPS: v3_attach.js (v3sens)
//  recalculates ksens and msens from it every frame. Pause still is host_framerate: it stops the demo and leaves the camera alive.
// =====================================================================

// ---- pause ----
alias "playbackPause" "host_timescale 1; demo_timescale 1; host_framerate 10000000; demo_resume"
bind "e" "playbackPause"

// ---- toggle binds ----
alias "playbackSuperSlowToggle" "host_timescale 1; host_framerate 0; demo_timescale 0.0667; demo_resume"
alias "playbackSlowToggle"      "host_timescale 1; host_framerate 0; demo_timescale 0.3333; demo_resume"
alias "playbackNormalToggle"    "host_timescale 1; host_framerate 0; demo_timescale 1; demo_resume"
alias "playbackFastToggle"      "host_timescale 1; host_framerate 0; demo_timescale 8; demo_resume"

// ---- hold binds (release = pause) ----
alias "+playbackSuperSlowHold" "playbackSuperSlowToggle"
alias "-playbackSuperSlowHold" "playbackPause"
alias "+playbackSlowHold"      "playbackSlowToggle"
alias "-playbackSlowHold"      "playbackPause"
alias "+playbackNormalHold"    "playbackNormalToggle"
alias "-playbackNormalHold"    "playbackPause"
alias "+playbackFastHold"      "playbackFastToggle"
alias "-playbackFastHold"      "playbackPause"

// ---- select bind type (chosen in v3_user.cfg) ----
alias "playbackHold"   "bind v +playbackSuperSlowHold; bind b +playbackSlowHold; bind n +playbackNormalHold; bind m +playbackFastHold"
alias "playbackToggle" "bind v playbackSuperSlowToggle; bind b playbackSlowToggle; bind n playbackNormalToggle; bind m playbackFastToggle"

// ---- time skips (mirv_skip) : b1..b10 back, f1s..f10s forward ----
alias "skipfx" "mirv_deathmsg clear; playbackSuperSlowToggle; sfx_on"
alias "b1"  "mirv_skip time -1; skipfx"
alias "b2"  "mirv_skip time -2; skipfx"
alias "b3"  "mirv_skip time -3; skipfx"
alias "b4"  "mirv_skip time -4; skipfx"
alias "b5"  "mirv_skip time -5; skipfx"
alias "b6"  "mirv_skip time -6; skipfx"
alias "b7"  "mirv_skip time -7; skipfx"
alias "b8"  "mirv_skip time -8; skipfx"
alias "b9"  "mirv_skip time -9; skipfx"
alias "b10" "mirv_skip time -10; skipfx"
alias "f1s"  "mirv_skip time 1; skipfx"
alias "f2s"  "mirv_skip time 2; skipfx"
alias "f3s"  "mirv_skip time 3; skipfx"
alias "f5s"  "mirv_skip time 5; skipfx"
alias "f10s" "mirv_skip time 10; skipfx"

bind "q" "b3"          // 3 seconds back
bind "r" "f3s"         // 3 seconds forward

// demo ui (timeline) toggle
bind "f7" "demoui"
