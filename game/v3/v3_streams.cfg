// =====================================================================
//  v3_streams.cfg  -  mirv_streams stream definitions + toggles + presets
//  Every stream S has three aliases:  S (toggle)  S_on  S_off
//  Stream presets (what to record): s_edit  s_exr  s_d10  s_med  s_matte  s_all  s_none
//  Output codecs are assigned in v3_user.cfg (applyPresets)
// =====================================================================

// small sound helpers (named sfx_* so they never clash with snd_* cvars)
alias "sfx_on"   "play \sounds\ui\beepclear.vsnd_c"
alias "sfx_off"  "play \sounds\buttons\blip1.vsnd_c"
alias "sfx_pick" "play \sounds\ui\item_paper_pickup.vsnd_c"
alias "sfx_hit"  "play \sounds\physics\concrete\rock_impact_soft3.vsnd_c"


/////////////////
//BASIC STREAMS//
/////////////////

// ---- screen (the game window as-is, with HUD) ----
mirv_streams record screen enabled 0
alias "screen" "screen_on"
alias "screen_on"  "mirv_streams record screen enabled 1; alias screen screen_off; echo [+] SCREEN set to RECORD; sfx_on"
alias "screen_off" "mirv_streams record screen enabled 0; alias screen screen_on; echo [x] SCREEN NOT set to RECORD; sfx_off"

// ---- beauty (clean picture without HUD) ----
mirv_streams add normal beauty
mirv_streams edit beauty record 0
mirv_streams edit beauty capture beforeUi
alias "beauty" "beauty_on"
alias "beauty_on"  "mirv_streams edit beauty record 1; alias beauty beauty_off; echo [+] beauty set to RECORD; sfx_on"
alias "beauty_off" "mirv_streams edit beauty record 0; alias beauty beauty_on; echo [x] beauty NOT set to RECORD; sfx_off"

// ---- depth8 (8-bit RGB depth, dithered; lossless codec recommended) ----
mirv_streams add depth depth8
mirv_streams edit depth8 record 0
mirv_streams edit depth8 capture beforeUi
mirv_streams edit depth8 captureType depthRgb
mirv_streams edit depth8 depthCompositeSmoke 1
mirv_streams edit depth8 depthVal 4096
mirv_streams edit depth8 depthValMax 0
mirv_streams edit depth8 depthChannels dithered
mirv_streams edit depth8 depthMode pyramidalLinear
mirv_streams edit depth8 autoForceFullResSmoke 1
alias "depth8" "depth8_on"
alias "depth8_on"  "mirv_streams edit depth8 record 1; alias depth8 depth8_off; echo [+] depth8 set to RECORD; sfx_on"
alias "depth8_off" "mirv_streams edit depth8 record 0; alias depth8 depth8_on; echo [x] depth8 NOT set to RECORD; sfx_off"

// ---- depthexr (float depth, up to 23 bit; keep the preset afxClassic = .exr sequence) ----
mirv_streams add depth depthexr
mirv_streams edit depthexr record 0
mirv_streams edit depthexr capture beforeUi
mirv_streams edit depthexr captureType depthF
mirv_streams edit depthexr depthCompositeSmoke 1
mirv_streams edit depthexr depthVal 0
mirv_streams edit depthexr depthValMax 25000
mirv_streams edit depthexr depthChannels gray
mirv_streams edit depthexr depthMode pyramidalLinear
mirv_streams edit depthexr autoForceFullResSmoke 1
alias "depthexr" "depthexr_on"
alias "depthexr_on"  "mirv_streams edit depthexr record 1; alias depthexr depthexr_off; echo [+] depthexr set to RECORD; sfx_on"
alias "depthexr_off" "mirv_streams edit depthexr record 0; alias depthexr depthexr_on; echo [x] depthexr NOT set to RECORD; sfx_off"

// ---- depth10 (10-bit depth in one ProRes file, from the HLAE wiki; needs FFmpeg 8+) ----
mirv_streams add normal depth10
mirv_streams edit depth10 record 0
mirv_streams edit depth10 capture beforeUi
mirv_streams edit depth10 captureType depthF
mirv_streams edit depth10 depthChannels gray
mirv_streams edit depth10 depthMode pyramidalLinear
mirv_streams edit depth10 depthVal 0
mirv_streams edit depth10 depthValMax 4096
mirv_streams edit depth10 settings ffDepth
alias "depth10" "depth10_on"
alias "depth10_on"  "mirv_streams edit depth10 record 1; alias depth10 depth10_off; echo [+] depth10 set to RECORD; sfx_on"
alias "depth10_off" "mirv_streams edit depth10 record 0; alias depth10 depth10_on; echo [x] depth10 NOT set to RECORD; sfx_off"

// ---- depthmed (10-bit depth + median filter against speckles; players removed in 2nd stream) ----
// Two streams are interleaved into ONE output file. Always toggle them together with depthmed / depthmed_on / depthmed_off.
mirv_streams add normal dmed
mirv_streams edit dmed record 0
mirv_streams edit dmed capture beforeUi
mirv_streams edit dmed captureType depthF
mirv_streams edit dmed depthChannels gray
mirv_streams edit dmed depthMode pyramidalLinear
mirv_streams edit dmed depthVal 0
mirv_streams edit dmed depthValMax 4096
mirv_streams edit dmed settings dInter
mirv_streams add normal dmedNoEnts
mirv_streams edit dmedNoEnts record 0
mirv_streams edit dmedNoEnts capture beforeUi
mirv_streams edit dmedNoEnts captureType depthF
mirv_streams edit dmedNoEnts depthChannels gray
mirv_streams edit dmedNoEnts depthMode pyramidalLinear
mirv_streams edit dmedNoEnts depthVal 0
mirv_streams edit dmedNoEnts depthValMax 4096
mirv_streams edit dmedNoEnts beforeCommands clear
mirv_streams edit dmedNoEnts beforeCommands add sc_setclassflags SkinnedObject 8
mirv_streams edit dmedNoEnts afterCommands clear
mirv_streams edit dmedNoEnts afterCommands add sc_setclassflags SkinnedObject 0
mirv_streams edit dmedNoEnts settings dInter2
alias "depthmed" "depthmed_on"
alias "depthmed_on"  "mirv_streams edit dmed record 1; mirv_streams edit dmedNoEnts record 1; alias depthmed depthmed_off; echo [+] depthmed (median depth) set to RECORD; sfx_on"
alias "depthmed_off" "mirv_streams edit dmed record 0; mirv_streams edit dmedNoEnts record 0; alias depthmed depthmed_on; echo [x] depthmed NOT set to RECORD; sfx_off"


///////////////////////////
//MATTE STREAMS (alpha)   //
///////////////////////////
// HLAE 2.192.2+ and FFmpeg. Codecs: world/particles -> afxFfmpegProres, others -> afxFfmpegProresAlpha
// What HLAE puts on each (checked in CS2, HLAE 2.192):
//   mplayers   - players WITH the weapons in their hands
//   mweapons   - only weapons lying on the ground (a weapon in a hand belongs to its player: empty when none lie around)
//   mviewmodel - the first person hands and gun: empty in free camera / campath
//   mpblack / mpwhite - particles (smoke, flashes, sparks) on black / white, no alpha:
//              particles = (mpwhite - mpblack) + mpblack. All black / all white = no particles in the shot
//   mheld      - weapons in hands (and on the ground / belts) without the players, see below

mirv_streams add world mworld
mirv_streams add weaponsMatte mweapons
mirv_streams add playersMatte mplayers
mirv_streams add viewModelMatte mviewmodel
mirv_streams add particlesBlack mpblack
mirv_streams add particlesWhite mpwhite
mirv_streams edit mworld record 0
mirv_streams edit mweapons record 0
mirv_streams edit mplayers record 0
mirv_streams edit mviewmodel record 0
mirv_streams edit mpblack record 0
mirv_streams edit mpwhite record 0

alias "mworld" "mworld_on"
alias "mworld_on"  "mirv_streams edit mworld record 1; alias mworld mworld_off; echo [+] matte WORLD set to RECORD; sfx_on"
alias "mworld_off" "mirv_streams edit mworld record 0; alias mworld mworld_on; echo [x] matte WORLD NOT set to RECORD; sfx_off"
alias "mweapons" "mweapons_on"
alias "mweapons_on"  "mirv_streams edit mweapons record 1; alias mweapons mweapons_off; echo [+] matte WEAPONS set to RECORD; sfx_on"
alias "mweapons_off" "mirv_streams edit mweapons record 0; alias mweapons mweapons_on; echo [x] matte WEAPONS NOT set to RECORD; sfx_off"
alias "mplayers" "mplayers_on"
alias "mplayers_on"  "mirv_streams edit mplayers record 1; alias mplayers mplayers_off; echo [+] matte PLAYERS set to RECORD; sfx_on"
alias "mplayers_off" "mirv_streams edit mplayers record 0; alias mplayers mplayers_on; echo [x] matte PLAYERS NOT set to RECORD; sfx_off"
alias "mviewmodel" "mviewmodel_on"
alias "mviewmodel_on"  "mirv_streams edit mviewmodel record 1; alias mviewmodel mviewmodel_off; echo [+] matte VIEWMODEL set to RECORD; sfx_on"
alias "mviewmodel_off" "mirv_streams edit mviewmodel record 0; alias mviewmodel mviewmodel_on; echo [x] matte VIEWMODEL NOT set to RECORD; sfx_off"
alias "mpblack" "mpblack_on"
alias "mpblack_on"  "mirv_streams edit mpblack record 1; alias mpblack mpblack_off; echo [+] matte PARTICLES BLACK set to RECORD; sfx_on"
alias "mpblack_off" "mirv_streams edit mpblack record 0; alias mpblack mpblack_on; echo [x] matte PARTICLES BLACK NOT set to RECORD; sfx_off"
alias "mpwhite" "mpwhite_on"
alias "mpwhite_on"  "mirv_streams edit mpwhite record 1; alias mpwhite mpwhite_off; echo [+] matte PARTICLES WHITE set to RECORD; sfx_on"
alias "mpwhite_off" "mirv_streams edit mpwhite record 0; alias mpwhite mpwhite_on; echo [x] matte PARTICLES WHITE NOT set to RECORD; sfx_off"

// ---- mheld (weapons in players' hands, black on white: use as an inverted luma matte) ----
// No HLAE matte gives them alone: their colour pass is drawn as part of the players, so an alpha matte of them
// is always empty. Their depth pass is drawn as weapons, so this is a depth stream of the weapons only, with
// a huge range: every weapon is black, the rest white. Not hidden behind walls or bodies (those are not drawn):
// multiply it with the mplayers alpha to drop weapons behind walls.
mirv_streams add normal mheld
mirv_streams edit mheld record 0
mirv_streams edit mheld capture beforeUi
mirv_streams edit mheld captureType depthRgb
mirv_streams edit mheld depthChannels gray
mirv_streams edit mheld depthMode pyramidalLinear
mirv_streams edit mheld depthVal 0
mirv_streams edit mheld depthValMax 100000
mirv_streams edit mheld depthCompositeSmoke 0
mirv_streams edit mheld weaponsAction draw
mirv_streams edit mheld playersAction noDraw
mirv_streams edit mheld worldAction noDraw
mirv_streams edit mheld skyAction noDraw
mirv_streams edit mheld viewModelAction noDraw
mirv_streams edit mheld particlesAction noDraw
mirv_streams edit mheld firstPersonLegsAction noDraw
mirv_streams edit mheld shellsAction noDraw
mirv_streams edit mheld smokeAction noDraw
mirv_streams edit mheld overlaysAction noDraw
mirv_streams edit mheld settings afxFfmpegProres
alias "mheld" "mheld_on"
alias "mheld_on"  "mirv_streams edit mheld record 1; alias mheld mheld_off; echo [+] matte HELD WEAPONS set to RECORD; sfx_on"
alias "mheld_off" "mirv_streams edit mheld record 0; alias mheld mheld_on; echo [x] matte HELD WEAPONS NOT set to RECORD; sfx_off"


///////////////////
//SPECIAL STREAMS//
///////////////////

// ---- audio (startmovie wav) ----
snd_filter ""
mirv_streams record startMovieWav 0
alias "audio" "audio_on"
alias "audio_on"  "mirv_streams record startMovieWav 1; alias audio audio_off; echo [+] AUDIO set to RECORD; sfx_on"
alias "audio_off" "mirv_streams record startMovieWav 0; alias audio audio_on; echo [x] AUDIO NOT set to RECORD; sfx_off"
alias "voiceONLY"   "play ui\beepclear; snd_filter voice; echo +voice_only"
alias "stepsONLY"   "play ui\beepclear; snd_filter player\footsteps\; echo +steps_only"
alias "weaponsONLY" "play ui\beepclear; snd_filter weapons; echo +weapons_only"
// to clear the filter type directly in console:  snd_filter ""

// ---- camera (.cam file -> Blender / After Effects / Cinema 4D importers) ----
mirv_streams record cam enabled 0
alias "cam" "cam_on"
alias "cam_on"  "mirv_streams record cam enabled 1; alias cam cam_off; echo [+] CAMERA (.cam export) set to RECORD; sfx_on"
alias "cam_off" "mirv_streams record cam enabled 0; alias cam cam_on; echo [x] CAMERA NOT set to RECORD; sfx_off"

// ---- campath (saves the campath xml together with the recording) ----
mirv_streams record campath enabled 0
alias "campath" "campath_on"
alias "campath_on"  "mirv_streams record campath enabled 1; alias campath campath_off; echo [+] CAMPATH set to RECORD; sfx_on"
alias "campath_off" "mirv_streams record campath enabled 0; alias campath campath_on; echo [x] CAMPATH NOT set to RECORD; sfx_off"


/////////////////////
//STREAM PRESETS    //
/////////////////////
// Explicit (not toggling): each preset first switches everything off.

alias "s_none"  "screen_off; beauty_off; depth8_off; depthexr_off; depth10_off; depthmed_off; mworld_off; mweapons_off; mplayers_off; mviewmodel_off; mpblack_off; mpwhite_off; mheld_off; audio_off; cam_off; campath_off"
alias "s_edit"  "s_none; beauty_on; depth8_on; audio_on; cam_on; campath_on; echo PRESET s_edit: beauty + depth8 + audio + cam + campath"
alias "s_exr"   "s_none; beauty_on; depthexr_on; audio_on; cam_on; campath_on; echo PRESET s_exr: beauty + depth EXR + audio + cam + campath"
alias "s_d10"   "s_none; beauty_on; depth10_on; audio_on; cam_on; campath_on; echo PRESET s_d10: beauty + 10-bit depth + audio + cam + campath"
alias "s_med"   "s_none; beauty_on; depthmed_on; audio_on; cam_on; campath_on; echo PRESET s_med: beauty + median depth + audio + cam + campath"
alias "s_matte" "s_none; mworld_on; mweapons_on; mplayers_on; mviewmodel_on; mpblack_on; mpwhite_on; mheld_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_matte: all alpha mattes + audio + cam + campath + depth"
alias "s_all"   "s_none; screen_on; beauty_on; depth8_on; depth10_on; mworld_on; mweapons_on; mplayers_on; mviewmodel_on; mpblack_on; mpwhite_on; mheld_on; audio_on; cam_on; campath_on; echo PRESET s_all"
alias "s_screen" "s_none; screen_on; audio_on; cam_on; echo PRESET s_screen: screen + audio + cam"

// ---- matte presets (alpha layers). All of them also record depth (alias depthStream, set in v3_user.cfg) + audio + cam + campath ----
alias "s_mplayers" "s_none; mplayers_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_mplayers: players only + depth"
alias "s_mchars"   "s_none; mworld_on; mplayers_on; mweapons_on; mheld_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_mchars: world + players + weapons + held weapons + depth"
alias "s_mpov"     "s_none; mworld_on; mplayers_on; mweapons_on; mheld_on; mviewmodel_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_mpov: world + players + weapons + held weapons + viewmodel + depth"
alias "s_mfx"      "s_none; mworld_on; mpblack_on; mpwhite_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_mfx: world + particles on black and white + depth"
alias "s_mbeauty"  "s_none; beauty_on; mworld_on; mplayers_on; mweapons_on; mheld_on; mviewmodel_on; mpblack_on; mpwhite_on; depthStream; audio_on; cam_on; campath_on; echo PRESET s_mbeauty: beauty + all 7 mattes + depth"
alias "s_mfull"    "s_none; beauty_on; depthStream; mworld_on; mplayers_on; mweapons_on; mheld_on; mviewmodel_on; mpblack_on; mpwhite_on; audio_on; cam_on; campath_on; echo PRESET s_mfull: beauty + depth + all 7 mattes"
