// =====================================================================
//  v3_camera.cfg  -  POV / free camera / camera speed / orientation
// =====================================================================

// ---- POV and free camera ----
bind "p" "ac stop; mirv_input end; ac_mode 1; playbackNormalToggle; echo [P] POV (mirv_input end); sfx_hit"
bind "f" "ac stop; ac_mode 4; mirv_input camera; echo [F] FREE CAMERA (press P or ESC if you are out of the map); sfx_hit"

// ---- mouse rotation axis (wheel click) ----
alias "localMouseAxis" "localMouseAxis_on"
alias "localMouseAxis_on"  "mirv_input cfg rotLocalSpace 1; echo [Wheel] mouse uses LOCAL axis; sfx_on; alias localMouseAxis localMouseAxis_off"
alias "localMouseAxis_off" "mirv_input cfg rotLocalSpace 0; echo [Wheel] mouse uses WORLD axis; sfx_off; alias localMouseAxis localMouseAxis_on"
bind "mouse3" "localMouseAxis"

// ---- camera speed ----
alias "speed_up2"     "mirv_input cfg kForwardSpeed 2560; mirv_input cfg kBackwardSpeed 2560; mirv_input cfg kLeftSpeed 2560; mirv_input cfg kRightSpeed 2560; mirv_input cfg kUpSpeed 2560; mirv_input cfg kDownSpeed 2560; mirv_input cfg kPitchPositiveSpeed 1440; mirv_input cfg kPitchNegativeSpeed 1440"
alias "speed_up1"     "mirv_input cfg kForwardSpeed 640; mirv_input cfg kBackwardSpeed 640; mirv_input cfg kLeftSpeed 640; mirv_input cfg kRightSpeed 640; mirv_input cfg kUpSpeed 640; mirv_input cfg kDownSpeed 640; mirv_input cfg kPitchPositiveSpeed 360; mirv_input cfg kPitchNegativeSpeed 360"
alias "speed_default" "mirv_input cfg kForwardSpeed 320; mirv_input cfg kBackwardSpeed 320; mirv_input cfg kLeftSpeed 320; mirv_input cfg kRightSpeed 320; mirv_input cfg kUpSpeed 320; mirv_input cfg kDownSpeed 320; mirv_input cfg kPitchPositiveSpeed 180; mirv_input cfg kPitchNegativeSpeed 180"
alias "speed_down1"   "mirv_input cfg kForwardSpeed 160; mirv_input cfg kBackwardSpeed 160; mirv_input cfg kLeftSpeed 160; mirv_input cfg kRightSpeed 160; mirv_input cfg kUpSpeed 160; mirv_input cfg kDownSpeed 160; mirv_input cfg kPitchPositiveSpeed 90; mirv_input cfg kPitchNegativeSpeed 90"
alias "speed_down2"   "mirv_input cfg kForwardSpeed 40; mirv_input cfg kBackwardSpeed 40; mirv_input cfg kLeftSpeed 40; mirv_input cfg kRightSpeed 40; mirv_input cfg kUpSpeed 40; mirv_input cfg kDownSpeed 40; mirv_input cfg kPitchPositiveSpeed 22.5; mirv_input cfg kPitchNegativeSpeed 22.5"

alias "speed_level2"  "speed_up2; alias speed_increase speed_level2; alias speed_decrease speed_level1; echo camera speed x8 (max)"
alias "speed_level1"  "speed_up1; alias speed_increase speed_level2; alias speed_decrease speed_level0; echo camera speed x2"
alias "speed_level0"  "speed_default; alias speed_increase speed_level1; alias speed_decrease speed_level-1; echo camera speed x1 (default)"
alias "speed_level-1" "speed_down1; alias speed_increase speed_level0; alias speed_decrease speed_level-2; echo camera speed x0.5"
alias "speed_level-2" "speed_down2; alias speed_increase speed_level-1; alias speed_decrease speed_level-2; echo camera speed x0.125 (min)"

bind "mouse5" "speed_increase; sfx_on"
bind "mouse4" "speed_decrease; sfx_off"

// ---- orientation (relative to the world axis) ----
bind "i" "mirv_input angles 0 0 0; echo [I] look forward; sfx_hit"
bind "j" "mirv_input angles 0 90 0; echo [J] look left; sfx_hit"
bind "k" "mirv_input angles 0 180 0; echo [K] look back; sfx_hit"
bind "l" "mirv_input angles 0 -90 0; echo [L] look right; sfx_hit"
bind "u" "mirv_input angles -90 * *; echo [U] look up; sfx_hit"
bind "o" "mirv_input angles 90 * *; echo [O] look down; sfx_hit"
bind "y" "mirv_input angles 0 * *; echo [Y] head level; sfx_hit"
