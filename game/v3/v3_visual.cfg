// =====================================================================
//  v3_visual.cfg  -  HUD, viewmodel, bloom, DOF, sky, smoke, flash
// =====================================================================

// ---- HUD (F5 toggles) ----
alias "hud0" "cl_drawhud 0; cl_draw_only_deathnotices 1; echo (hud0) HUD OFF; sfx_off"
alias "hud1" "cl_drawhud 1; cl_draw_only_deathnotices 0; echo (hud1) HUD ON; sfx_on"
alias "hud2" "cl_drawhud 1; cl_draw_only_deathnotices 1; echo (hud2) killfeed and crosshair only; sfx_on"
alias "hud_on"  "hud1; alias hud hud_off"
alias "hud_off" "hud0; alias hud hud_on"
alias "hud" "hud_off"
bind "f5" "hud"

// ---- viewmodel / bloom / near clipping ----
alias "viewmodel1" "r_drawviewmodel 1; echo viewmodel ON"
alias "viewmodel0" "r_drawviewmodel 0; echo viewmodel OFF"
alias "bloom1" "r_csgo_effects_bloom 1; r_csgo_render_post_bloom 1; echo bloom ON"
alias "bloom0" "r_csgo_effects_bloom 0; r_csgo_render_post_bloom 0; echo bloom OFF"
alias "near1" "fov_cs_near_z 6.5; echo near clipping ON"
alias "near0" "fov_cs_near_z 0.1; echo near clipping OFF"

// ---- flash / smoke (check with the in-game help if your HLAE build differs) ----
alias "flash0" "mirv_noflash 1; echo flashbang effect REMOVED"
alias "flash1" "mirv_noflash 0; echo flashbang effect restored"
// smoke hide / show through class flags (HLAE wiki: Tutorials CS2 -> Remove smoke effects)
alias "smoke0" "sc_setclassflags SmokeVolumeObject 8; echo smoke HIDDEN"
alias "smoke1" "sc_setclassflags SmokeVolumeObject 0; echo smoke SHOWN"

// ---- sky (mirv_sky). Material path example (copy it from Source2Viewer, pak01_dir.vpk -> materials/skybox):
//   mirv_sky material "materials/skybox/<file>.vmat_c"
// Re-apply after every map change.
alias "sky_reset" "mirv_sky material default; mirv_sky color default; mirv_sky clouds color default; mirv_sky clouds draw 1; echo sky reset"
alias "clouds0"   "mirv_sky clouds draw 0; echo clouds OFF"
alias "clouds1"   "mirv_sky clouds draw 1; echo clouds ON"

// ---- DOF ( , and . change the focus state, / toggles DOF ) ----
bind "/" "dof"
alias "dof" "dof_on"
alias "dof_on" "alias dof dof_off; r_dof_override 1; echo DOF has been ENABLED; play \sounds\ui\beepclear.vsnd_c"
alias "dof_off" "alias dof dof_on; r_dof_override 0; echo DOF has been DISABLED; play \sounds\buttons\blip1.vsnd_c"

alias "dofState1" "r_dof_override 1; alias dof dof_off; r_dof_override_near_blurry -100; r_dof_override_near_crisp 0; r_dof_override_far_crisp 0; r_dof_override_far_blurry 50; alias next_dof_state dofState2; echo DOF state 1 of 21"
alias "dofState2" "r_dof_override 1; alias dof dof_off; r_dof_override_near_blurry -100; r_dof_override_near_crisp 0; r_dof_override_far_crisp 50; r_dof_override_far_blurry 150; alias next_dof_state dofState3; alias prev_dof_state dofState1; echo DOF state 2 of 21"
