alias "prev_dof_state" "dofState1"
alias "current_dof_state" "dofState2"
alias "next_dof_state" "dofState3"

bind "," "prev_dof_state; alias current_dof_state prev_dof_state; sfx_hit"
bind "." "next_dof_state; alias current_dof_state next_dof_state; sfx_hit"
// the same on PageUp / PageDown (these keys do not depend on the keyboard layout)
bind "pgup" "prev_dof_state; alias current_dof_state prev_dof_state; sfx_hit"
bind "pgdn" "next_dof_state; alias current_dof_state next_dof_state; sfx_hit"

// ---- misc physics reset ----
alias "resetmisc" "rope_shake 0; sv_gravity 800; ragdoll_gravity_scale 1; ragdoll_friction_scale 0.6; cl_player_ragdolls_collide 0; cl_phys_timescale 1; echo misc physics reset"

// ---- full visual reset ----
alias "resetvisual" "viewmodel1; bloom1; near1; flash1; smoke1; sky_reset; dof_off; resetmisc"
