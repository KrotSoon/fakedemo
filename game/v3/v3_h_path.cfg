echo "  KEY        ACTION"
echo "  ---        ------"
echo "  G          add point (autosave to campath_backup.xml)"
echo "  0 ... 9    select point with that id"
echo "  ]          deselect all"
echo "  DEL        delete selected (or all if none selected)"
echo "  C          playback on / off"
echo "  H          show / hide the path"
echo "  RShift     set position + angles + fov of selection to current"
echo "  Enter      set start time of selection to current demo time"
echo ""
echo "  EDIT SELECTED POINTS"
echo "  --------------------"
echo "  pos        position = current"
echo "  ang        angles = current"
echo "  fov        fov = current"
echo "  move       move whole path so point #0 is at the camera"
echo "  linear     linear interpolation (2+ points)"
echo "  cubic      cubic interpolation (4+ points)"
echo ""
echo "  OTHER"
echo "  -----"
echo "  rp0 ... rp20     delete point by id"
echo "  pr               print all points"
echo "  cpsave1 .. 3     save to slot 1-3"
echo "  cpload1 .. 3     load from slot 1-3"
echo "  cprestore        load the autosave"
