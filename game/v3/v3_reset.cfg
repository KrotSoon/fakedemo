// =====================================================================
//  v3_reset.cfg  -  restore YOUR binds and neutral playback state
//  (type 'reset'). The binds come from fd_unfake.cfg (made by the FakeDemo launcher)
// =====================================================================

ac off
mirv_input end
host_timescale 1
host_framerate 0
demo_timescale 1
cl_drawhud 1
cl_draw_only_deathnotices 0
r_drawviewmodel 1
cl_view_near_hud_player_eye_dist 20
cl_view_near_other_player_eye_dist 16
r_dof_override 0

// your own binds back: FakeDemo builds fd_unfake.cfg from your Steam binds (unbindall + every key)
exec fd_unfake

echo Game settings have been reset
