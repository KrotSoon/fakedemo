// =====================================================================
//  v3_campath.cfg  -  camera path (mirv_campath)
// =====================================================================

mirv_campath enabled 1
mirv_campath draw enabled 1

// ---- toggle campath visibility (H) ----
alias "hideCampath" "hideCampath_on"
alias "hideCampath_on"  "mirv_campath draw enabled 0; echo [H] campath HIDDEN; sfx_on; alias hideCampath hideCampath_off"
alias "hideCampath_off" "mirv_campath draw enabled 1; echo [H] campath SHOWN; sfx_off; alias hideCampath hideCampath_on"
bind "h" "hideCampath"

// ---- toggle campath playback (C) ----
alias "campathPlayback" "campathPlayback_off"
alias "campathPlayback_off" "mirv_campath enabled 0; echo [C] campath playback DISABLED; sfx_off; alias campathPlayback campathPlayback_on"
alias "campathPlayback_on"  "mirv_campath enabled 1; echo [C] campath playback ENABLED; sfx_on; alias campathPlayback campathPlayback_off"
bind "c" "campathPlayback"

// ---- add a point (G) and auto-backup after every add ----
bind "g" "mirv_campath add; mirv_campath save campath_backup.xml; echo [G] campath point ADDED (backup saved); sfx_hit"

// ---- select points: keys 0-9, ] = deselect ----
bind "0" "mirv_campath select #0 #0; echo [0] point #0 selected; play \sounds\ui\beep07.vsnd_c"
bind "1" "mirv_campath select #1 #1; echo [1] point #1 selected; play \sounds\ui\beep07.vsnd_c"
bind "2" "mirv_campath select #2 #2; echo [2] point #2 selected; play \sounds\ui\beep07.vsnd_c"
bind "3" "mirv_campath select #3 #3; echo [3] point #3 selected; play \sounds\ui\beep07.vsnd_c"
bind "4" "mirv_campath select #4 #4; echo [4] point #4 selected; play \sounds\ui\beep07.vsnd_c"
bind "5" "mirv_campath select #5 #5; echo [5] point #5 selected; play \sounds\ui\beep07.vsnd_c"
bind "6" "mirv_campath select #6 #6; echo [6] point #6 selected; play \sounds\ui\beep07.vsnd_c"
bind "7" "mirv_campath select #7 #7; echo [7] point #7 selected; play \sounds\ui\beep07.vsnd_c"
bind "8" "mirv_campath select #8 #8; echo [8] point #8 selected; play \sounds\ui\beep07.vsnd_c"
bind "9" "mirv_campath select #9 #9; echo [9] point #9 selected; play \sounds\ui\beep07.vsnd_c"
bind "]" "mirv_campath select none; echo all points deselected; play \sounds\ui\beep22.vsnd_c"

// ---- delete selected points (or the whole path when nothing is selected) ----
bind "del" "mirv_campath clear; echo [DEL] selected points deleted; play \sounds\weapons\molotov\fire_ignite_2.vsnd_c"

// ---- delete point by id: rp0 .. rp20 ----
alias "rp0"  "mirv_campath remove 0"
alias "rp1"  "mirv_campath remove 1"
alias "rp2"  "mirv_campath remove 2"
alias "rp3"  "mirv_campath remove 3"
alias "rp4"  "mirv_campath remove 4"
alias "rp5"  "mirv_campath remove 5"
alias "rp6"  "mirv_campath remove 6"
alias "rp7"  "mirv_campath remove 7"
alias "rp8"  "mirv_campath remove 8"
alias "rp9"  "mirv_campath remove 9"
alias "rp10" "mirv_campath remove 10"
alias "rp11" "mirv_campath remove 11"
alias "rp12" "mirv_campath remove 12"
alias "rp13" "mirv_campath remove 13"
alias "rp14" "mirv_campath remove 14"
alias "rp15" "mirv_campath remove 15"
alias "rp16" "mirv_campath remove 16"
alias "rp17" "mirv_campath remove 17"
alias "rp18" "mirv_campath remove 18"
alias "rp19" "mirv_campath remove 19"
alias "rp20" "mirv_campath remove 20"

// ---- edit selected points to the CURRENT camera ----
alias "pos" "mirv_campath edit position current; echo selected points: POSITION = current; sfx_on"
alias "ang" "mirv_campath edit angles current; echo selected points: ANGLES = current; sfx_on"
alias "fov" "mirv_campath edit fov current; echo selected points: FOV = current; sfx_on"
bind "rshift" "mirv_campath edit position current; mirv_campath edit angles current; mirv_campath edit fov current; echo [RSHIFT] position + angles + fov = current; sfx_on"

// ---- time ----
bind "enter" "mirv_campath edit start; echo [ENTER] start time of selection = current demo time; sfx_off"
alias "move" "mirv_campath select none; mirv_campath edit anchor #0 current; echo campath moved so point #0 is at the current position; sfx_on"

// ---- interpolation ----
alias "linear" "mirv_campath edit interp position linear; mirv_campath edit interp rotation slinear; mirv_campath edit interp fov linear; echo interpolation = LINEAR (2+ points); sfx_on"
alias "cubic"  "mirv_campath edit interp position default; mirv_campath edit interp rotation default; mirv_campath edit interp fov default; echo interpolation = CUBIC (4+ points); sfx_on"

// ---- save / load slots (files go to the game .exe folder) ----
alias "cpsave1" "mirv_campath save campath_1.xml; echo campath saved to slot 1"
alias "cpsave2" "mirv_campath save campath_2.xml; echo campath saved to slot 2"
alias "cpsave3" "mirv_campath save campath_3.xml; echo campath saved to slot 3"
alias "cpload1" "mirv_campath load campath_1.xml; mirv_campath enabled 1; echo campath loaded from slot 1"
alias "cpload2" "mirv_campath load campath_2.xml; mirv_campath enabled 1; echo campath loaded from slot 2"
alias "cpload3" "mirv_campath load campath_3.xml; mirv_campath enabled 1; echo campath loaded from slot 3"
alias "cprestore" "mirv_campath load campath_backup.xml; mirv_campath enabled 1; echo campath restored from autosave"

// ---- info ----
alias "pr" "echo CAMPATH INFORMATION; mirv_campath print; sfx_pick"
