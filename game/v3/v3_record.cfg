// =====================================================================
//  v3_record.cfg  -  start / stop recording, motion blur, scheduled commands
//  This file is executed LAST by 'fe' and applies the settings from v3_user.cfg
// =====================================================================

// ---- common part of every start alias ----
alias "rec_common" "startRecordingCommands; host_timescale 1; demo_timescale 1; demo_resume"

// ---- start at a given fps (free camera speed is scaled together with fps) ----
alias "30fps"    "mirv_streams record fps 30;    mirv_input cfg ksens 0.12; mirv_input cfg msens 0.008; rec_common; echo 30 FPS RECORDING started;    mirv_streams record start"
alias "60fps"    "mirv_streams record fps 60;    mirv_input cfg ksens 0.18; mirv_input cfg msens 0.012; rec_common; echo 60 FPS RECORDING started;    mirv_streams record start"
alias "125fps"   "mirv_streams record fps 125;   mirv_input cfg ksens 0.36; mirv_input cfg msens 0.024; rec_common; echo 125 FPS RECORDING started;   mirv_streams record start"
alias "250fps"   "mirv_streams record fps 250;   mirv_input cfg ksens 0.9;  mirv_input cfg msens 0.06;  rec_common; echo 250 FPS RECORDING started;   mirv_streams record start"
alias "500fps"   "mirv_streams record fps 500;   mirv_input cfg ksens 1.8;  mirv_input cfg msens 0.12;  rec_common; echo 500 FPS RECORDING started;   mirv_streams record start"
alias "1000fps"  "mirv_streams record fps 1000;  mirv_input cfg ksens 3.6;  mirv_input cfg msens 0.24;  rec_common; echo 1000 FPS RECORDING started;  mirv_streams record start"
alias "2000fps"  "mirv_streams record fps 2000;  mirv_input cfg ksens 7.2;  mirv_input cfg msens 0.48;  rec_common; echo 2000 FPS RECORDING started;  mirv_streams record start"
alias "4000fps"  "mirv_streams record fps 4000;  mirv_input cfg ksens 7.2;  mirv_input cfg msens 0.48;  rec_common; echo 4000 FPS RECORDING started;  mirv_streams record start"

// ---- stop (F1) : ends the recording and freezes the demo ----
alias "recstop" "mirv_streams record end; stopRecordingCommands; playbackPause; sfx_off; echo RECORDING stopped"
// quick start binds (change the fps in the recF* aliases if you like)
alias "recF1" "recstop"
alias "recF2" "60fps"
alias "recF3" "500fps"
alias "recF4" "1000fps"
bind "f1" "recF1"
bind "f2" "recF2"
bind "f3" "recF3"
bind "f4" "recF4"
// while Shift is held, F1-F4 do nothing (Shift+F2 = CS2 demo timeline, must not start a recording); Shift keeps +sprint
alias "v3lock" "echo [Shift] recording keys locked"
alias "+v3shift" "+sprint; alias recF1 v3lock; alias recF2 v3lock; alias recF3 v3lock; alias recF4 v3lock"
alias "-v3shift" "-sprint; alias recF1 recstop; alias recF2 60fps; alias recF3 500fps; alias recF4 1000fps"
bind "shift" "+v3shift"

// ---- motion blur on / off (INSERT) ----
// blur_on : beauty and screen go through the 'blur' sampler (output fps = blur fps from v3_user.cfg)
alias "blur" "blur_on"
alias "blur_on"  "mirv_streams edit beauty settings blur; mirv_streams record screen settings blur; alias blur blur_off; echo MOTION BLUR ON (record at high fps: 1000 / 24 = ~42 samples); sfx_on"
alias "blur_off" "applyPresets; alias blur blur_on; echo MOTION BLUR OFF (codecs restored from v3_user.cfg); sfx_off"
bind "ins" "blur"


// =====================================================================
//  mirv_cmd : run commands automatically at a demo moment
//  Scheduled commands are run while the demo plays and while recording.
// =====================================================================

// Schedule a command at the CURRENT demo time (pause the demo at the moment you want, then type):
alias "at_hud0"     "mirv_cmd add hud0"
alias "at_hud1"     "mirv_cmd add hud1"
alias "at_hud2"     "mirv_cmd add hud2"
alias "at_dof_on"   "mirv_cmd add dof_on"
alias "at_dof_off"  "mirv_cmd add dof_off"
alias "at_rec_stop" "mirv_cmd add recstop"

// Manage the schedule
alias "cmdprint" "mirv_cmd print"
alias "cmdclear" "mirv_cmd clear; echo scheduled commands cleared"
alias "cmdsave"  "mirv_cmd save cmd_schedule.xml; echo scheduled commands saved"
alias "cmdload"  "mirv_cmd load cmd_schedule.xml; echo scheduled commands loaded"

// Examples (type in the console, replace the numbers):
//   mirv_cmd addAtTick 1337 "mirv_streams record start"
//   mirv_cmd addAtTick 9000 "mirv_streams record end"
//   mirv_cmd addAtTick 4000 "mirv_fov 60"


// =====================================================================
//  Apply the settings chosen in v3_user.cfg
// =====================================================================
applyPresets
streamsStart
playbackMode
hudStart
speedStart
echo ""
echo "CS2 editing config v3 loaded. Type fehelp for the list of binds."
