// =====================================================================
//  v3.cfg  -  entry point of the CS2 / HLAE editing config (v3)
//  Put all files from this folder into your HLAE moviemaking cfg folder
//  (or ...\game\csgo\cfg), then in the console:  exec v3
//  After that:  join a demo (playdemo <name>)  and type  fe
//
//  Only v3_user.cfg should be edited. Every other file is a module.
// =====================================================================

// FPS cap. CS2 refuses to change fps_max while a demo is playing ("Can't change 'fps_max' right now"),
// so it is set here: run 'exec v3' in the main menu BEFORE playdemo.
// Playback speed aliases are calibrated for 120. Bad PC? use 60 and halve every host_framerate in v3_playback.cfg
fps_max 120

// Load order matters: presets and streams must exist before v3_user assigns them
// quiet console first (hides the "bind interpretation" spam); can be changed in v3_user.cfg
alias "logsLevel" "exec v3_logsLow"
alias "fe" "logsLevel; exec v3_unlock; exec v3_ffmpeg; exec v3_streams; exec v3_user; exec v3_playback; exec v3_camera; exec v3_campath; exec v3_killfeed; exec v3_visual; exec v3_record; exec v3_attach"

// Reload a single module without redoing everything
alias "r_user"     "exec v3_user; applyPresets; echo v3_user.cfg reloaded"
alias "r_streams"  "exec v3_ffmpeg; exec v3_streams; exec v3_user; applyPresets; echo streams reloaded"

// Reset game binds / state to normal (use after you finish editing)
alias "reset" "exec v3_reset"

// help: print blank lines first so the page is always at the bottom (the clear command is executed too late)
alias "fehelp"    "exec v3_blank; exec v3_help"
alias "h_play"    "exec v3_blank; exec v3_h_play"
alias "h_cam"     "exec v3_blank; exec v3_h_cam"
alias "h_path"    "exec v3_blank; exec v3_h_path"
alias "h_rec"     "exec v3_blank; exec v3_h_rec"
alias "h_streams" "exec v3_blank; exec v3_h_streams"
alias "h_vis"     "exec v3_blank; exec v3_h_vis"
alias "h_kf"      "exec v3_blank; exec v3_h_kf"
alias "h_cmd"     "exec v3_blank; exec v3_h_cmd"
alias "h_att"     "exec v3_blank; exec v3_h_att"
alias "h_all"     "exec v3_blank; exec v3_h_play; exec v3_h_cam; exec v3_h_path; exec v3_h_rec; exec v3_h_streams; exec v3_h_vis; exec v3_h_kf; exec v3_h_cmd; exec v3_h_att"

echo ""
echo "__________________________[MAIN-MENU]__________________________"
echo "fe     -> load the editing config (join the demo first)"
echo "fehelp -> list of binds and commands"
echo "reset  -> restore default game binds"
echo "r_user -> reload v3_user.cfg only"
echo "_______________________________________________________________"
