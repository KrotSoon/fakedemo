// =====================================================================
//  v3_attach.cfg  -  camera attached to a player / object
//  Executed by "fe". The script itself is v3_attach.js (same folder).
// =====================================================================

// mirv_script_load needs the full path to v3_attach.js: the FakeDemo launcher writes it into v3_path_js.cfg
exec v3_path_js

// ---- your presets ----
// set the camera up, type ac_print, paste the printed line here and rename it:
// ac_def <name> <obj> <look> <forward> <right> <up> <pitch> <yaw> <roll> <smoothPos> <smoothRot> <fov> [pitchMax 0..89]
// ac_def myknife hand eye -4 6 4 0 0 0 0.05 0.08 0

// ---- keys: numpad (free in v3) ----
bind "KP_0"          "ac"                  // 0: on / off
bind "KP_7"          "ac_p spec"           // 7: watched player
bind "KP_1"          "ac_p prev"           // 1: previous player
bind "KP_3"          "ac_p next"           // 3: next player
bind "KP_5"          "ac_o next"           // 5: next object
bind "KP_4"          "ac_preset prev"      // 4: previous preset
bind "KP_6"          "ac_preset next"      // 6: next preset
bind "KP_DEL"        "ac_list"             // .: list players / objects
bind "KP_ENTER"      "ac_print"            // Enter: print preset line
