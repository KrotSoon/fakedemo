// =====================================================================
//  v3_user.cfg  -  THE ONLY FILE YOU NEED TO EDIT
// =====================================================================


///////////////////
//OUTPUT / PATHS //
///////////////////

// Folder where recordings are written
// set in the FakeDemo launcher (v3_path_rec.cfg). Your own folder: comment the exec out and write
// mirv_streams record name "X:\your\folder"
exec v3_path_rec

// Stream preset applied on startup: s_edit | s_exr | s_d10 | s_med | s_matte | s_all | s_screen | s_none
alias "streamsStart" "s_edit"

// Default depth stream for all matte presets: depth10_on | depth8_on | depthexr_on | depthmed_on
alias "depthStream" "depth10_on"

// Codec per stream. Available: afxClassic utTrue prores good Prores4444 afxFfmpegProres afxFfmpegProresAlpha blur
// Tip for AE: prores / afxFfmpegProresAlpha.  Tip for Blender/C4D depth: depthexr (afxClassic) or depth10.
alias "applyPresets" "applyPresets1; applyPresets2"
alias "applyPresets1" "mirv_streams record screen settings utTrue; mirv_streams edit beauty settings prores; mirv_streams edit depth8 settings utTrue; mirv_streams edit depthexr settings afxClassic"
alias "applyPresets2" "mirv_streams edit mworld settings afxFfmpegProres; mirv_streams edit mweapons settings afxFfmpegProresAlpha; mirv_streams edit mplayers settings afxFfmpegProresAlpha; mirv_streams edit mviewmodel settings afxFfmpegProresAlpha; mirv_streams edit mpblack settings afxFfmpegProres; mirv_streams edit mpwhite settings afxFfmpegProres"
// depth10 and depthmed always use ffDepth / dInter (see v3_ffmpeg.cfg)

// Motion blur: output fps and inner codec of the 'blur' sampler
mirv_streams settings edit blur settings utTrue
mirv_streams settings edit blur fps 24
// blur_on / blur_off aliases are in v3_record.cfg


/////////////
//VISUALS  //
/////////////

mirv_viewmodel enabled 1
mirv_viewmodel set 2.5 2 -2 68 0     // horizontal depth vertical fov (0 = right handed, 1 = left handed)
fov_cs_debug 0                       // POV FOV (anything but 0 disables scope zoom animation)
mirv_fov handleZoom enabled 1
// mirv_fov 90                       // uncomment for a fixed freecam / campath fov
crosshair 1
alias "hudStart" "hud1"              // hud0 off | hud1 on | hud2 killfeed + crosshair only


/////////
//AUDIO//
/////////

volume 0.04
snd_toolvolume 0.1                   // volume of 'play' feedback sounds
tv_listen_voice_indices -1           // voices from players 0-31
tv_listen_voice_indices_h -1         // voices from players 32-63
sv_alltalk 1


///////////
//CONSOLE//
///////////

con_enable 1
alias "logsLevel" "exec v3_logsLow"    // exec v3_logsLow = echo + command responses only, exec v3_logsDefault = everything
log_color Console f8bbffff           // echo color
log_color General adffa7FF           // command response color


////////////
//PLAYBACK//
////////////

// fps_max is set in v3.cfg (it cannot be changed during a demo)
alias "playbackMode" "playbackHold"  // playbackHold = hold keys | playbackToggle = toggle keys
spec_usenumberkeys_nobinds 0         // 0 = number keys select campath points, 1 = select players
alias "speedStart" "speed_level0"    // startup free camera speed: speed_level-2 .. speed_level2


////////////////
//FREE CAMERA //
////////////////

mirv_input cfg ksens 0.36
mirv_input cfg msens 0.024
mirv_input cfg mouseMoveSupport 1    // scroll = fov, hold LMB/RMB = move
mirv_input cfg mFovPositiveSpeed 90
mirv_input cfg mFovNegativeSpeed 90
mirv_input cfg kFovPositiveSpeed 100
mirv_input cfg kFovNegativeSpeed 100
mirv_input cfg stepFactor 2
mirv_input cfg smooth enabled 0
mirv_input cfg rotLocalSpace 0


////////////
//CAMPATH //
////////////

mirv_campath hold 1                  // hold first / last keyframe before / after the path
mirv_campath draw keyIndex 8         // show keyframe ids (0 = off)


/////////////
//RECORDING//
/////////////

// Commands executed when recording starts / stops
alias "startRecordingCommands" "mirv_campath draw enabled 0; toggleconsole"
alias "stopRecordingCommands"  "mirv_campath draw enabled 1"
