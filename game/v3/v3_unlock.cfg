// =====================================================================
//  v3_unlock.cfg  -  unlock commands and reset demo playback state
// =====================================================================

sv_cheats 1
mirv_cvar_unlock_sv_cheats      // unlock commands that require sv_cheats 1
mirv_cvar_unhide_all            // unhide all hidden commands (needed for sc_setclassflags etc.)

// HLAE fixes (both are already ON by default, listed here for clarity)
mirv_fix forceClInterpRatio 1   // sets cl_interp_ratio 1 after demo load -> less player stutter in recordings

// Demo playback state
cl_clock_correction 0           // remove potential demo stutter
sv_disable_observer_interpolation 1
spec_autodirector 0
host_timescale 1
demo_timescale 1
host_framerate 0
demo_resume
demo_ui_mode 0                  // hide demo ui after demo is loaded

// Cosmetic
r_show_build_info 0
cl_spec_show_bindings 0
