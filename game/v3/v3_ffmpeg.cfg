// =====================================================================
//  v3_ffmpeg.cfg  -  output presets for mirv_streams
//  Requires: HLAE 2.192.x + FFmpeg 8+ (the HLAE installer ships a recent ffmpeg)
//  Assigning presets to streams is done in v3_user.cfg (applyPresets alias)
// =====================================================================

// ---- simple ffmpeg presets (the part after the input is what you write) ----
mirv_streams settings add ffmpeg utTrue "";
mirv_streams settings add ffmpeg prores "";
mirv_streams settings add ffmpeg good "";
mirv_streams settings add ffmpeg Prores4444 "";

// Ut Video lossless (.avi) - needs the Ut Video codec installed to open in AE / Premiere
mirv_streams settings edit utTrue options "-c:v utvideo -pix_fmt gbrp {QUOTE}{AFX_STREAM_PATH}.avi{QUOTE}";
// ProRes 4444 bt709 with alpha channel (.mov) - the best choice for After Effects
mirv_streams settings edit prores options "-c:v prores -profile:v 4 -pix_fmt yuva444p10le -vf setsar=1:1,scale=out_color_matrix=bt709 -color_primaries bt709 -color_trc bt709 -colorspace bt709 {QUOTE}{AFX_STREAM_PATH}.mov{QUOTE}";
// x264 crf10 (.mp4) - small size, for previews only
mirv_streams settings edit good options "-c:v libx264 -crf 10 -preset fast -tune fastdecode -level:v 5.2 -vf setsar=1:1,zscale=matrix=709,format=yuv420p -color_primaries bt709 -color_trc bt709 -colorspace bt709 -x264-params keyint=12:min-keyint=1:ref=1:bframes=0:qcomp=0.8:aq-strength=0.5:dct-decimate=0:fast-pskip=0:deblock=-2,-2 {QUOTE}{AFX_STREAM_PATH}.mp4{QUOTE}";
// ProRes 4444 10-bit (from the HLAE wiki)
mirv_streams settings edit Prores4444 options "-c:v prores_ks -profile:v 4 -pix_fmt yuv444p10le {QUOTE}{AFX_STREAM_PATH}\\video.mov{QUOTE}";

// ---- 10-bit depth (HLAE 2.188+, FFmpeg 8+) ----
// Used by the depth10 stream. If you change depthValMax in v3_streams.cfg, change BOTH 4096 values.
mirv_streams settings add ffmpegEx ffDepth "";
mirv_streams settings edit ffDepth options "{QUOTE}{FFMPEG_PATH}{QUOTE} -f rawvideo -pixel_format {PIXEL_FORMAT} -loglevel repeat+level+warning -framerate {FRAMERATE} -video_size {WIDTH}x{HEIGHT} -i pipe:0";
mirv_streams settings edit ffDepth options+ " -filter_complex {QUOTE}[0:v]setsar=sar=1/1,geq=lum_expr='p(X,Y)/4096'[out]{QUOTE}";
mirv_streams settings edit ffDepth options+ " -c:v prores_ks -profile:v 4 -pix_fmt yuv444p10le -map {QUOTE}[out]{QUOTE} {QUOTE}{AFX_STREAM_PATH}\\video.mov{QUOTE}";

// ---- depth with entities removed + median filter (cleans depth speckles) ----
// Used by the depthmed stream pair (two streams are interleaved into one file)
mirv_streams settings add ffmpegEx ffInterMaskEx "";
mirv_streams settings edit ffInterMaskEx options "{QUOTE}{FFMPEG_PATH}{QUOTE} -f rawvideo -pixel_format {PIXEL_FORMAT} -loglevel repeat+level+warning -framerate {FRAMERATE} -video_size {WIDTH}x{HEIGHT} -i pipe:0";
mirv_streams settings edit ffInterMaskEx options+ " -filter_complex {QUOTE}[0:v]setsar=sar=1/1,geq=lum_expr='p(X,Y)/4096'[s];[s]select=n=2:e='mod(n,2)+1'[s0][s1];[s0]setpts=(PTS/2-STARTPTS/2)[s0s];[s1]setpts=(PTS/2-STARTPTS/2)[s1s];[s0s][s1s]blend=all_expr='clip(abs(A-B)*2048,0,1)',median[out]{QUOTE}";
mirv_streams settings edit ffInterMaskEx options+ " -c:v prores_ks -profile:v 4 -pix_fmt yuv444p10le -map {QUOTE}[out]{QUOTE} -fps_mode passthrough {QUOTE}{AFX_STREAM_PATH}\\video.mov{QUOTE}";
mirv_streams settings add interleave dInter dInter2;
mirv_streams settings edit dInter settings ffInterMaskEx;

// ---- motion blur sampler ----
// blur_amount = record_fps / blur_output_fps   (e.g. 1000 / 24 = ~42 samples per frame)
mirv_streams settings add sampler blur
mirv_streams settings edit blur strength 1
mirv_streams settings edit blur method rectangle
mirv_streams settings edit blur exposure 1

echo ""
echo "___________________________[FFMPEG]____________________________"
echo "afxClassic            -> built-in, TGA sequence"
echo "afxFfmpegProres       -> built-in, ProRes (no alpha)"
echo "afxFfmpegProresAlpha  -> built-in, ProRes with alpha (mattes)"
echo "utTrue                -> lossless Ut Video .avi"
echo "prores                -> ProRes 4444 bt709 .mov"
echo "good                  -> x264 .mp4 (small)"
echo "Prores4444            -> ProRes 4444 10-bit .mov"
echo "blur                  -> sampler (motion blur), not a codec"
echo "_______________________________________________________________"
