// =====================================================================
//  v3_killfeed.cfg  -  mirv_deathmsg
// =====================================================================

mirv_deathmsg clear
mirv_deathmsg lifeTime default
mirv_deathmsg lifeTimeMod 20          // lifetime modifier for the local player
mirv_deathmsg localplayer default
mirv_deathmsg filter clear
mp_display_kill_assists 0

// ---- players list with ids (use ids in filters) ----
alias "list" "mirv_deathmsg help players; echo players list (mirv_deathmsg help players); sfx_pick"

// ---- highlight kills of the CURRENT player and hide everyone else's ----
alias "red" "mirv_deathmsg localplayer xTrace; mirv_deathmsg filter add attackerMatch=!xTrace victimMatch=!xTrace block=1 lastRule=1; echo killfeed: only the current player (red); play \sounds\physics\flesh\flesh_squishy_impact_hard4.vsnd_c"

// ---- remove noscope / thrusmoke / attackerblind icons ----
alias "kf_clean" "mirv_deathmsg filter add noscope=0 thrusmoke=0 attackerblind=0; echo killfeed: kill icons removed (resetkf to undo); sfx_on"

// ---- colors ----
alias "kf_colors_cs"  "mirv_deathmsg colors ct white; mirv_deathmsg colors t red; echo killfeed colors: CT white / T red; sfx_on"
alias "kf_colors_off" "mirv_deathmsg colors ct default; mirv_deathmsg colors t default; mirv_deathmsg colors border default; mirv_deathmsg colors background default; mirv_deathmsg colors backgroundLocal default; echo killfeed colors: default; sfx_off"

// ---- reset ----
alias "resetkf" "mirv_deathmsg clear; mirv_deathmsg lifeTime default; mirv_deathmsg localplayer default; mirv_deathmsg filter clear; kf_colors_off; echo KILLFEED reset; play \sounds\ambient\weather\rain_drip2.vsnd_c"

bind "end"  "resetkf"
bind "home" "red"
